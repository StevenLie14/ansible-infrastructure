load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    js_import registry from /etc/nginx/r/registry.js;
    js_set $registry_token_args registry.tokenArgs;
    js_set $registry_v2_args registry.v2Args;

    server {
        listen 443 ssl;
        server_name r.slc.net;

        ssl_certificate     /certs/slc.tld.chained.crt;
        ssl_certificate_key /certs/slc.tld.key;

        client_max_body_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location /v2/ {
            set $args $registry_v2_args;
            rewrite ^/v2/([^/]+)/(blobs|manifests|tags|referrers)(/.*)?$ /v2/slc-rdt/$1/$2$3 break;
            js_header_filter registry.challenge;
            proxy_pass http://nginx:8080;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 900;
            proxy_send_timeout 900;
        }

        location = /service/token {
            set $args $registry_token_args;
            proxy_pass http://nginx:8080;
        }

        location / {
            proxy_pass http://nginx:8080;
        }
    }

    server {
        listen 8002;
        server_name _;

        proxy_set_header Host r.slc.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /service/token {
            set $args $registry_token_args;
            proxy_pass http://nginx:8080;
        }
    }
}
