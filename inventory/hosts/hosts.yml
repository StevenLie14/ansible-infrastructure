all:
  hosts:
    root-target-server:
      ansible_host: "{{ lookup('env', 'ANSIBLE_HOST') }}"
      ansible_user: "{{ lookup('env', 'ANSIBLE_USER') }}"
      ansible_ssh_pass: "{{ lookup('env', 'ANSIBLE_PASS') }}"
      ansible_become_pass: "{{ lookup('env', 'ANSIBLE_PASS') }}"
    github-actions-runner:
      ansible_host: "{{ lookup('env', 'ANSIBLE_HOST') }}"
      ansible_user: "{{ lookup('env', 'RUNNER_USER') }}"
      ansible_ssh_pass: "{{ lookup('env', 'RUNNER_PASSWORD') }}"
    syahdan:
      ansible_host: 10.200.212.66
      ansible_user: root
      ansible_ssh_private_key_file: /root/.ssh/ansible/back-server
      deploy_apt_update_cache: false
    # Machine for the containerised Forgejo runner; CI jobs run here. For now it
    # points at docker-dev (no production apps). Never use a production host.
    ci-runner:
      ansible_host: "{{ lookup('env', 'CI_RUNNER_HOST') }}"
      ansible_user: "{{ lookup('env', 'CI_RUNNER_USER') }}"
      ansible_become_pass: "{{ lookup('env', 'CI_RUNNER_PASSWORD') }}"
      ansible_ssh_private_key_file: /root/.ssh/ansible/ci-runner
    docker-apps:
      ansible_host: "{{ lookup('env', 'DEPLOY_HOST_DOCKER_APPS') }}"
      ansible_user: "{{ lookup('env', 'DEPLOY_USER_DOCKER_APPS') | default(lookup('env', 'DEPLOY_ADMIN_USER'), true) }}"
      ansible_become_pass: "{{ lookup('env', 'DEPLOY_PASSWORD_DOCKER_APPS') }}"
      ansible_ssh_private_key_file: /root/.ssh/ansible/docker-apps
      deploy_apt_update_cache: false
    galaxion:
      ansible_host: "{{ lookup('env', 'DEPLOY_HOST_GALAXION') }}"
      ansible_user: "{{ lookup('env', 'DEPLOY_USER_GALAXION') | default(lookup('env', 'DEPLOY_ADMIN_USER'), true) }}"
      ansible_become_pass: "{{ lookup('env', 'DEPLOY_PASSWORD_GALAXION') }}"
      ansible_ssh_private_key_file: /root/.ssh/ansible/galaxion
      deploy_apt_update_cache: false
    weblinux:
      ansible_host: "{{ lookup('env', 'DEPLOY_HOST_WEB_LINUX') }}"
      ansible_user: "{{ lookup('env', 'DEPLOY_USER_WEB_LINUX') | default(lookup('env', 'DEPLOY_ADMIN_USER'), true) }}"
      ansible_ssh_pass: "{{ lookup('env', 'DEPLOY_PASSWORD_WEB_LINUX') }}"
      ansible_become_pass: "{{ lookup('env', 'DEPLOY_PASSWORD_WEB_LINUX') }}"
    vegeta:
      ansible_host: "{{ lookup('env', 'DEPLOY_HOST_VEGETA') }}"
      ansible_user: "{{ lookup('env', 'DEPLOY_USER_VEGETA') | default(lookup('env', 'DEPLOY_ADMIN_USER'), true) }}"
      ansible_ssh_pass: "{{ lookup('env', 'DEPLOY_PASSWORD_VEGETA') }}"
      ansible_become_pass: "{{ lookup('env', 'DEPLOY_PASSWORD_VEGETA') }}"
  children:
    # Hosts CI deploys to over SSH (deploy-target role).
    deploy_targets:
      hosts:
        docker-apps:
        galaxion:
        syahdan:
        weblinux:
