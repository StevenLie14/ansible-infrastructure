repo_url: "{{ lookup('env', 'GITHUB_REPO_URL') }}"
github_repo: "{{ repo_url.split('/')[-1] }}"
github_owner: "{{ repo_url.split('/')[-2] }}"
github_token: "{{ lookup('env', 'GITHUB_PAT') }}"

secrets:
  - name: "REGISTRY_PASSWORD"
    value: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"
  - name: "REGISTRY_URL"
    value: "{{ lookup('env', 'REGISTRY_URL') }}"
  - name: "REGISTRY_USERNAME"
    value: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
  - name: "VAULT_PASSWORD"
    value: "{{ lookup('env', 'VAULT_PASSWORD') }}"
  - name: "VAULT_PATH"
    value: "{{ lookup('env', 'VAULT_PATH') }}/{{ github_repo }}"
  - name: "VAULT_URL"
    value: "{{ lookup('env', 'VAULT_URL') }}"
  - name: "VAULT_USERNAME"
    value: "{{ lookup('env', 'VAULT_USERNAME') }}"
# Optional: set a single secret instead of the whole list above.
#   -e target_secret_key=MY_KEY -e target_secret_value=my-value
# Empty = set every secret listed above.
target_secret_key: ""
target_secret_value: ""

# Optional: sync every non-archived repo owned by github_owner instead of just
# the repo in GITHUB_REPO_URL.
#   -e target_all_repos=true
# VAULT_PATH is then rebuilt per repo as <VAULT_PATH>/<repo-name>.
target_all_repos: false
github_repo_limit: 200
vault_path_base: "{{ lookup('env', 'VAULT_PATH') }}"

# Optional: work against an organization (or another user) instead of the owner
# parsed from GITHUB_REPO_URL.
#   -e target_owner=my-org
target_owner: ""
