# Secrets for the hardened workflows, set by the forgejo-secret role.

deploy_key_dir: "/workdir/keys/deploy"

# Organization-level: every repo reads these.
org_secrets:
  - name: "DEPLOY_HOST"
    value: "{{ lookup('env', 'DEPLOY_HOST_DOCKER_APPS') }}"
  - name: "DEPLOY_HOST_GALAXION"
    value: "{{ lookup('env', 'DEPLOY_HOST_GALAXION') }}"
  - name: "DEPLOY_HOST_SYAHDAN"
    value: "{{ lookup('env', 'DEPLOY_HOST_SYAHDAN') }}"
  - name: "DEPLOY_HOST_WEB_LINUX"
    value: "{{ lookup('env', 'DEPLOY_HOST_WEB_LINUX') }}"
  # Output of: ssh-keyscan -t ed25519 <each deploy host>. Lets CI verify it is
  # talking to the real host instead of trusting whatever answers.
  - name: "DEPLOY_KNOWN_HOSTS"
    value: "{{ lookup('ansible.builtin.file', '/workdir/keys/deploy_known_hosts', errors='ignore') | default('', true) }}"
  # base64 of the PEM that signed Vault's certificate (vault-action caCertificate).
  - name: "VAULT_CA_CERT"
    value: "{{ lookup('ansible.builtin.file', '/workdir/keys/vault-ca.pem', errors='ignore') | default('', true) | b64encode }}"

# Turn on with -e delete_legacy_secrets=true once every repo runs the new workflows.
delete_legacy_secrets: false
legacy_secrets:
  - "VAULT_USERNAME"
  - "VAULT_PASSWORD"
  - "SERVER_PWD"
  # Was a copy of the org admin FORGEJO_TOKEN in every repo; no workflow used it.
  - "TTP"
