forgejo_url: "{{ lookup('env', 'FORGEJO_URL') }}"
forgejo_org_name: "{{ lookup('env', 'FORGEJO_ORG_NAME') }}"
forgejo_token: "{{ lookup('env', 'FORGEJO_TOKEN') }}"
# Set FORGEJO_VALIDATE_CERTS=false only when Forgejo uses an internal/self-signed CA.
forgejo_validate_certs: "{{ (lookup('env', 'FORGEJO_VALIDATE_CERTS') | default('true', true)) | bool }}"

secrets:
  - name: "REGISTRY_PASSWORD"
    value: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"
  - name: "REGISTRY_URL"
    value: "{{ lookup('env', 'REGISTRY_URL') }}"
  - name: "REGISTRY_USERNAME"
    value: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
  - name: "VAULT_PASSWORD"
    value: "{{ lookup('env', 'VAULT_PASSWORD') }}"
  - name: "VAULT_PATH"
    value: "{{ lookup('env', 'VAULT_PATH') }}"
  - name: "VAULT_URL"
    value: "{{ lookup('env', 'VAULT_URL') }}"
  - name: "VAULT_USERNAME"
    value: "{{ lookup('env', 'VAULT_USERNAME') }}"

# Optional: limit the run to one or more repos instead of the whole org.
# Single repo:    -e target_repo=my-service
# Several repos:  -e '{"target_repos":["svc-a","svc-b"]}'
# Empty = all repos in the org.
target_repo: ""
target_repos: []
