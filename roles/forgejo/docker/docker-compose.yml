services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${FORGEJO_DB_USER}
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWD}
      - POSTGRES_DB=${FORGEJO_DB_NAME}
    networks:
      - forgejo_net
    # No published port: Forgejo reaches it as db:5432 on forgejo_net, and
    # nothing outside this host should talk to the database directly.
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  forgejo:
    image: code.forgejo.org/forgejo/forgejo:${FORGEJO_VERSION:-17.0.0}
    container_name: forgejo
    restart: always
    depends_on:
      - db
    environment:
      - USER_UID=${FORGEJO_UID}
      - USER_GID=${FORGEJO_GID}
      - FORGEJO__database__DB_TYPE=${FORGEJO_DB_TYPE}
      - FORGEJO__database__HOST=${FORGEJO_DB_HOST}
      - FORGEJO__database__NAME=${FORGEJO_DB_NAME}
      - FORGEJO__database__USER=${FORGEJO_DB_USER}
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWD}
    networks:
      - forgejo_net
    ports:
      - "${FORGEJO_HTTP_PORT:-3000}:3000"
      - "${FORGEJO_SSH_PORT:-2222}:22"
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

networks:
  forgejo_net:
    driver: bridge