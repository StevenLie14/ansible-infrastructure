# For multiple

- name: Initialize repository list
  set_fact:
    list_of_repo_names: []

- name: Fetch repository pages from Forgejo
  ansible.builtin.uri:
    url: "{{ forgejo_url }}/api/v1/orgs/{{ forgejo_org_name }}/repos?page={{ item }}&limit=100"
    method: GET
    headers:
      Authorization: "token {{ forgejo_token }}"
  loop: "{{ range(1, 3) | list }}"
  register: repo_pages

- name: Combine repository names (lowercased)
  set_fact:
    list_of_repo_names: >-
      {{
        repo_pages.results
        | map(attribute='json')
        | select('defined')
        | select('truthy')
        | list
        | flatten
        | map(attribute='name')
        | map('lower')
        | list
      }}

- name: Inject Secrets into each Forgejo Repository
  include_tasks: "/workdir/roles/forgejo-secret/tasks/set_forgejo_repo_secrets.yml"
  loop: "{{ list_of_repo_names }}"
  loop_control:
    loop_var: current_repo