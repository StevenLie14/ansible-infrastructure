- name: "Processing Secrets for Repo: {{ current_repo }}"
  block:
    # Some repos keep their config under a name other than the repo's
    # (prk -> kv/data/bimay-prk, nar -> kv/data/nar-fe) and had VAULT_PATH set
    # by hand. Only fill VAULT_PATH in where it is missing so those survive.
    - name: List existing secrets of {{ current_repo }}
      ansible.builtin.uri:
        url: "{{ forgejo_url }}/api/v1/repos/{{ forgejo_org_name }}/{{ current_repo }}/actions/secrets?limit=100"
        validate_certs: "{{ forgejo_validate_certs }}"
        headers:
          Authorization: "token {{ forgejo_token }}"
      register: existing_secrets

    - name: Set Static Secrets via Forgejo API
      ansible.builtin.uri:
        url: "{{ forgejo_url }}/api/v1/repos/{{ forgejo_org_name }}/{{ current_repo }}/actions/secrets/{{ item.name }}"
        method: PUT
        validate_certs: "{{ forgejo_validate_certs }}"
        status_code: [201, 204]
        body_format: json
        body:
          data: "{{ item.value }}"
        headers:
          Authorization: "token {{ forgejo_token }}"
          Content-Type: "application/json"
      loop: "{{ secrets | rejectattr('name', 'equalto', 'VAULT_PATH') | list }}"
      no_log: true

    - name: Set Dynamic VAULT_PATH Secret (kv/data/{{ current_repo }})
      when: "'VAULT_PATH' not in (existing_secrets.json | map(attribute='name') | list)"
      ansible.builtin.uri:
        url: "{{ forgejo_url }}/api/v1/repos/{{ forgejo_org_name }}/{{ current_repo }}/actions/secrets/VAULT_PATH"
        method: PUT
        validate_certs: "{{ forgejo_validate_certs }}"
        status_code: [201, 204]
        body_format: json
        body:
          data: "kv/data/{{ current_repo }}"
        headers:
          Authorization: "token {{ forgejo_token }}"
          Content-Type: "application/json"
      no_log: true

    # Private half of the key scripts/gen-deploy-keys.sh made for this repo.
    # The deploy-target role installs the public half behind a forced command.
    - name: Set DEPLOY_SSH_KEY from keys/deploy/{{ current_repo }}
      ansible.builtin.uri:
        url: "{{ forgejo_url }}/api/v1/repos/{{ forgejo_org_name }}/{{ current_repo }}/actions/secrets/DEPLOY_SSH_KEY"
        method: PUT
        validate_certs: "{{ forgejo_validate_certs }}"
        status_code: [201, 204]
        body_format: json
        body:
          data: "{{ deploy_private_key }}"
        headers:
          Authorization: "token {{ forgejo_token }}"
          Content-Type: "application/json"
      vars:
        deploy_private_key: "{{ lookup('ansible.builtin.file', deploy_key_dir + '/' + current_repo, errors='ignore') | default('', true) }}"
      when: deploy_private_key | length > 0
      no_log: true

    # Credentials the hardened workflows no longer use. Off by default so the
    # old workflows keep working until every repo has moved.
    - name: Delete legacy secrets
      ansible.builtin.uri:
        url: "{{ forgejo_url }}/api/v1/repos/{{ forgejo_org_name }}/{{ current_repo }}/actions/secrets/{{ item }}"
        method: DELETE
        validate_certs: "{{ forgejo_validate_certs }}"
        status_code: [204, 404]
        headers:
          Authorization: "token {{ forgejo_token }}"
      loop: "{{ legacy_secrets }}"
      when: delete_legacy_secrets | bool